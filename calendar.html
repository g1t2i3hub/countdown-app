<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
  <title>打卡回看</title>
  <link rel="stylesheet" href="calendar.css" />
</head>
<body>
  <div class="calendar-window" id="calendar-window">
    <!-- 顶部：标题 + 关闭按钮（可拖动） -->
    <div class="calendar-drag" id="calendar-drag">
      <span class="calendar-title">📅 打卡回看</span>
      <button class="calendar-close" id="calendar-close" type="button" aria-label="关闭">×</button>
    </div>

    <!-- 月份导航 -->
    <div class="cal-header">
      <button class="cal-nav" id="cal-prev" type="button">‹</button>
      <span class="cal-title" id="cal-title"></span>
      <button class="cal-nav" id="cal-next" type="button">›</button>
    </div>

    <!-- 星期表头 -->
    <div class="cal-weekdays" id="cal-weekdays"></div>

    <!-- 日期网格 -->
    <div class="cal-grid" id="cal-grid"></div>

    <!-- 统计区（周/月切换 + 柱状图 + 环形图） -->
    <div class="cal-stats">
      <div class="cal-stats-head">
        <span class="cal-stats-title">📊 统计</span>
        <div class="cal-stats-tabs">
          <button class="cal-stats-tab active" id="stats-week-btn" type="button">周</button>
          <button class="cal-stats-tab" id="stats-month-btn" type="button">月</button>
        </div>
      </div>
      <canvas class="stats-canvas" id="stats-bar-canvas"></canvas>
      <div class="cal-stats-row">
        <canvas class="stats-canvas donut" id="stats-donut-canvas"></canvas>
        <div class="stats-legend" id="stats-legend"></div>
      </div>
    </div>

    <!-- 选中日期详情 -->
    <div class="cal-detail" id="cal-detail"></div>
  </div>

  <script src="stats.js"></script>
  <script src="calendar.js"></script>
</body>
</html>
