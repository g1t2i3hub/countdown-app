<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
  <title>倒数日</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- 整块是透明窗口；内部悬浮条置顶，下拉面板点击展开在窗口内滑出 -->
  <div class="stage" id="stage">
    <!-- 悬浮条（常驻显示，展示「最近到期目标」） -->
    <div class="float-bar" id="float-bar">
      <div class="float-drag">
        <span class="float-days" id="float-days">--</span>
        <span class="float-unit" id="float-unit">天</span>
      </div>
      <span class="float-alarm hidden" id="float-alarm">⏰</span>
      <button class="float-eliminate" id="float-eliminate-btn">忍忍就过去了！</button>
      <button class="float-system" id="float-system-btn" type="button" title="系统设置">⚙</button>
      <span class="float-chevron">▾</span>
    </div>

    <!-- 下拉面板 -->
    <div class="dropdown-panel" id="dropdown-panel">
      <!-- 目标选择条（点 chip 切换；双击编辑；末位 ＋ 新建） -->
      <div class="target-bar" id="target-bar">
        <div class="target-chips" id="target-chips"></div>
        <button class="target-add" id="target-add" type="button" title="新建目标">＋</button>
      </div>

      <p class="message-text" id="message-text"></p>

      <!-- 连续打卡火焰角标 -->
      <div class="streak-badge hidden" id="streak-badge">
        🔥 连续 <span id="streak-count">0</span> 天 · 最长 <span id="streak-longest">0</span> 天
      </div>

      <div class="number-wrap">
        <span class="number" id="remaining-days">0</span>
        <span class="number-unit" id="number-unit">天</span>
      </div>

      <!-- 类目选择条 -->
      <div class="category-bar" id="category-bar">
        <div class="category-chips" id="category-chips"></div>
        <button class="category-add" id="category-add" type="button" title="新增类目">＋</button>
      </div>

      <button class="btn-eliminate" id="eliminate-btn">忍忍就过去了！</button>

      <!-- 今日待办 -->
      <div class="todo-section" id="todo-section">
        <div class="todo-add-row">
          <input id="todo-input" class="input todo-input" type="text"
                 placeholder="添加今日待办…" autocomplete="off" maxlength="80" />
          <button id="todo-add-btn" class="btn todo-add-btn" type="button">＋</button>
        </div>
        <ul class="todo-list" id="todo-list"></ul>
        <div class="todo-empty" id="todo-empty">今天还没有待办</div>

        <button class="todo-calendar-toggle" id="todo-calendar-toggle" type="button">
          <span>📅 回看历史与统计</span>
        </button>
      </div>

      <!-- 闹钟区 -->
      <div class="alarm-section" id="alarm-section">
        <div class="alarm-section-head">
          <span class="alarm-section-title">⏰ 闹钟</span>
          <button class="alarm-add-btn" id="alarm-add-btn" type="button">＋ 新建</button>
        </div>
        <div class="alarm-list" id="alarm-list"></div>
        <div class="alarm-empty" id="alarm-empty">还没有闹钟，点「新建」添加</div>
      </div>

      <!-- 番茄钟区 -->
      <div class="tool-section" id="pomodoro-section">
        <div class="tool-section-head">
          <span class="tool-section-title">🍅 番茄钟</span>
          <button class="tool-open-btn" id="pomodoro-open-btn" type="button">打开窗口</button>
        </div>
        <div class="pomodoro-status" id="pomodoro-status">未运行</div>
        <div class="pomodoro-settings">
          <label class="pomodoro-field"><span>专注</span><input id="pomodoro-work-input" type="number" min="1" max="180" step="1" /><span>分</span></label>
          <label class="pomodoro-field"><span>休息</span><input id="pomodoro-break-input" type="number" min="1" max="60" step="1" /><span>分</span></label>
          <label class="pomodoro-field"><span>循环</span><input id="pomodoro-cycles-input" type="number" min="1" max="12" step="1" /><span>次</span></label>
        </div>
        <button class="toolbar-btn" id="pomodoro-start-btn" type="button">开始专注</button>
      </div>

      <!-- 底部工具栏 -->
      <div class="footer-toolbar">
        <button class="toolbar-btn" id="edit-settings-btn" type="button">⚙ 修改设置</button>
        <button class="toolbar-btn" id="reset-history-btn" type="button">↺ 重置</button>
      </div>
    </div>
  </div>

  <!-- 目标 新建 / 编辑 界面（未配置或点击修改设置时显示） -->
  <section class="setup-view hidden" id="setup-view">
    <div class="setup-drag">
      <span class="panel-title">倒数日</span>
    </div>
    <h1 class="setup-title" id="setup-title">新建目标</h1>

    <label class="field">
      <span class="field-label">目标名称</span>
      <input id="target-name-input" class="input" type="text"
             placeholder="如：考研倒计时" autocomplete="off" maxlength="20" />
    </label>

    <label class="field">
      <span class="field-label">计时方式</span>
      <select id="count-mode-select" class="input select">
        <option value="countdown">倒计时（倒数到目标日期）</option>
        <option value="countup">正计时（记录已坚持天数）</option>
      </select>
    </label>

    <label class="field" id="target-date-field">
      <span class="field-label">目标日期</span>
      <input id="target-date-input" class="input" type="date" autocomplete="off" />
      <span class="field-hint" id="target-date-hint"></span>
    </label>

    <label class="field hidden" id="start-date-field">
      <span class="field-label">起点日期（可留空，首次打卡自动回填）</span>
      <input id="start-date-input" class="input" type="date" autocomplete="off" />
      <span class="field-hint">留空则从第一次打卡当天开始计算</span>
    </label>

    <label class="field" id="display-mode-field">
      <span class="field-label">剩余时间显示方式</span>
      <select id="display-mode-select" class="input select">
        <option value="days">仅天数（如 100 天）</option>
        <option value="months">月 + 天（如 3 个月 10 天）</option>
        <option value="years">年 + 月 + 天（如 1 年 2 个月 5 天）</option>
      </select>
    </label>

    <label class="field">
      <span class="field-label">主题</span>
      <select id="theme-select" class="input select">
        <option value="light">浅色 · 暖红</option>
        <option value="dark">深色 · 冷青</option>
        <option value="green">护眼 · 绿色</option>
      </select>
    </label>

    <button id="save-settings-btn" class="btn btn-primary">保存</button>
    <button id="cancel-edit-btn" class="btn btn-ghost hidden">取消</button>

    <p id="setup-error" class="error-text"></p>
  </section>

  <!-- 类目文案编辑浮层 -->
  <section class="category-edit-view hidden" id="category-edit-view">
    <div class="setup-drag">
      <span class="panel-title" id="category-edit-title">编辑类目文案</span>
    </div>

    <label class="field">
      <span class="field-label">含义</span>
      <input id="category-message-input" class="input" type="text"
             placeholder="距离完成还有 X 天" autocomplete="off" />
    </label>

    <label class="field">
      <span class="field-label">按钮文字（未打卡时）</span>
      <input id="category-active-text-input" class="input" type="text"
             placeholder="打卡·运动（默认）" autocomplete="off" maxlength="20" />
    </label>

    <label class="field">
      <span class="field-label">按钮文字（已打卡后）</span>
      <input id="category-done-text-input" class="input" type="text"
             placeholder="已打卡（默认）" autocomplete="off" maxlength="20" />
    </label>

    <button id="save-category-texts-btn" class="btn btn-primary">保存</button>
    <button id="cancel-category-texts-btn" class="btn btn-ghost">取消</button>
  </section>

  <!-- 新建闹钟浮层 -->
  <section class="alarm-edit-view hidden" id="alarm-edit-view">
    <div class="setup-drag">
      <span class="panel-title">新建闹钟</span>
    </div>

    <div class="alarm-type-tabs">
      <button class="alarm-type-tab active" id="alarm-tab-countdown" type="button">倒计时</button>
      <button class="alarm-type-tab" id="alarm-tab-fixed" type="button">定点</button>
    </div>

    <label class="field">
      <span class="field-label">名称（说明用途）</span>
      <input id="alarm-label-input" class="input" type="text"
             placeholder="如：起来活动一下 / 喝水" autocomplete="off" maxlength="20" />
    </label>

    <div class="field" id="alarm-countdown-field">
      <div class="alarm-sub-tabs">
        <button class="alarm-sub-tab active" id="alarm-subtab-relative" type="button">相对时长</button>
        <button class="alarm-sub-tab" id="alarm-subtab-absolute" type="button">指定日期时间</button>
      </div>

      <label class="field" id="alarm-relative-field">
        <span class="field-label">倒计时时长（分钟）</span>
        <input id="alarm-duration-input" class="input" type="number" min="1" max="720"
               placeholder="如：25" autocomplete="off" />
      </label>

      <div class="field hidden" id="alarm-absolute-field">
        <label class="field">
          <span class="field-label">日期</span>
          <input id="alarm-date-input" class="input" type="date" autocomplete="off" />
        </label>
        <label class="field">
          <span class="field-label">时间</span>
          <input id="alarm-time-absolute-input" class="input" type="time" />
        </label>
      </div>
    </div>

    <label class="field hidden" id="alarm-fixed-field">
      <span class="field-label">提醒时刻</span>
      <input id="alarm-time-input" class="input" type="time" />
    </label>

    <label class="field">
      <span class="field-label">重复</span>
      <select id="alarm-repeat-select" class="input select">
        <option value="once">仅一次</option>
        <option value="daily">每天</option>
      </select>
    </label>

    <button id="save-alarm-btn" class="btn btn-primary">保存</button>
    <button id="cancel-alarm-btn" class="btn btn-ghost">取消</button>
    <p id="alarm-error" class="error-text"></p>
  </section>

  <script src="renderer.js"></script>
</body>
</html>
